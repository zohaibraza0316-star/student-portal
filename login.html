<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Student Management Portal</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen auth-bg flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full overflow-hidden">
    <!-- Top Branding -->
    <div class="bg-slate-900 p-6 text-center">
      <div class="w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-xl mx-auto shadow-md">
        SM
      </div>
      <h1 class="text-xl font-bold text-white mt-3">Student Management Portal</h1>
      <p class="text-xs text-slate-400 mt-1">Login or Create an Admin Account to Continue</p>
    </div>

    <!-- Toggle Buttons (Login vs Create Account) -->
    <div class="grid grid-cols-2 gap-1 p-2 bg-slate-100 border-b border-slate-200">
      <button id="tabLoginBtn" type="button" class="py-2 rounded-lg text-sm font-semibold tab-btn-active transition">
        Login
      </button>
      <button id="tabSignupBtn" type="button" class="py-2 rounded-lg text-sm font-semibold tab-btn-inactive transition">
        Create Account
      </button>
    </div>

    <!-- Alert Message Box -->
    <div id="authAlert" class="hidden mx-6 mt-4 p-3 rounded-lg text-xs font-medium border"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="p-6 space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase">Email or Username *</label>
        <input id="loginEmail" type="text" required placeholder="Enter your email or username" class="mt-1 w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase">Password *</label>
        <div class="relative mt-1">
          <input id="loginPassword" type="password" required placeholder="Enter your password" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <button type="button" id="toggleLoginPass" class="absolute right-3 top-2.5 text-xs font-semibold text-indigo-600 hover:text-indigo-800">
            Show
          </button>
        </div>
      </div>

      <button type="submit" class="w-full py-2.5 rounded-lg text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700 transition shadow-md">
        Login to Portal
      </button>
    </form>

    <!-- CREATE ACCOUNT (SIGN UP) FORM -->
    <form id="signupForm" class="hidden p-6 space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase">Full Name / Academy Name *</label>
        <input id="signupName" type="text" required placeholder="e.g. Muhammad Zohaib Raza" class="mt-1 w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase">Email or Username *</label>
        <input id="signupEmail" type="text" required placeholder="e.g. zohaib@razatutors.com" class="mt-1 w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase">Password *</label>
          <input id="signupPassword" type="password" required minlength="4" placeholder="Min 4 chars" class="mt-1 w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase">Confirm Password *</label>
          <input id="signupConfirm" type="password" required minlength="4" placeholder="Repeat password" class="mt-1 w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
      </div>

      <button type="submit" class="w-full py-2.5 rounded-lg text-sm font-semibold bg-emerald-600 text-white hover:bg-emerald-700 transition shadow-md">
        Create New Account
      </button>
    </form>
  </div>

  <script src="auth.js"></script>
</body>
</html>
